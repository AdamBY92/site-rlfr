# ============================================================================
# Regeneration automatique des donnees du site
# ----------------------------------------------------------------------------
# Ce workflow relance les scripts de recuperation, commit les fichiers
# data/*.json s'ils ont reellement change, puis les televerse sur OVH.
#
# Il ne lance que DEUX scripts : les actualites officielles tournent sur la
# machine de l'auteur (voir l'etape desactivee plus bas).
#
# QUAND :
#   - automatiquement toutes les heures (a la minute 5) ;
#   - a la demande, depuis l'onglet Actions (bouton "Run workflow").
#
# SECRETS A CREER (Settings > Secrets and variables > Actions > New secret) :
#   FTP_SERVER     ftp.cluster129.hosting.ovh.net
#   FTP_USERNAME   rocketj
#   FTP_PASSWORD   (mot de passe FTP, depuis l'espace client OVH)
# Ils ne servent QU'A l'etape de deploiement. La recuperation des donnees,
# elle, n'utilise que des API publiques et ne demande aucune authentification.
#
# LES SCRIPTS SONT INDEPENDANTS : si l'un echoue, l'autre s'execute quand
# meme (continue-on-error), et le script en echec ne modifie pas son fichier
# JSON - le site continue d'afficher la derniere donnee valide.
# ============================================================================

name: Mise a jour des donnees

on:
  schedule:
    # Format : minute heure jour mois jour_semaine (UTC).
    # "5 * * * *" = a la minute 5 de chaque heure.
    # Pour repasser a une fois par jour : "5 0 * * *".
    - cron: "5 * * * *"
  workflow_dispatch:

# Autorise le job a pousser un commit sur le depot.
permissions:
  contents: write

# Empeche deux executions de se chevaucher (le cron horaire pourrait sinon
# croiser un declenchement manuel et provoquer un conflit de push).
concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    name: Recuperer et publier les donnees
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dependances
        run: npm ci

      # ----------------------------------------------------------------------
      # Les trois recuperations, dans l'ordre demande.
      # continue-on-error: true -> un echec n'interrompt pas la suite du job.
      # L'etape reste marquee en echec dans l'interface, et le recapitulatif
      # final (derniere etape) reprend le detail.
      # ----------------------------------------------------------------------
      - name: "1/2 - Compteur de membres Discord"
        id: membres
        continue-on-error: true
        run: node scripts/fetch-member-count.js

      # ----------------------------------------------------------------------
      # ETAPE DESACTIVEE : actualites officielles (scripts/fetch-updates.js)
      #
      # POURQUOI : www.rocketleague.com bloque les adresses IP des serveurs
      # GitHub (403, puis page de challenge anti-robot). Ce n'est pas reparable
      # par du code : le filtrage porte sur l'origine de la requete, pas sur
      # les en-tetes envoyes.
      #
      # OU TOURNE-T-ELLE MAINTENANT : sur la machine de l'auteur, une fois par
      # jour, via le Planificateur de taches Windows qui lance
      # scripts/maj-actualites.ps1. Ce script recupere les actualites PUIS
      # commit et pousse data/updates.json tout seul.
      #
      # SI LE BLOCAGE DISPARAIT UN JOUR : decommente les quatre lignes
      # ci-dessous, rajoute data/updates.json dans le "git add" plus bas, et
      # remets steps.actus dans le recapitulatif final.
      # ----------------------------------------------------------------------
      # - name: "Actualites officielles du jeu"
      #   id: actus
      #   continue-on-error: true
      #   run: node scripts/fetch-updates.js

      - name: "2/2 - Rotation de la boutique"
        id: boutique
        continue-on-error: true
        run: node scripts/fetch-shop.js

      # ----------------------------------------------------------------------
      # Commit UNIQUEMENT si le contenu a change.
      # "git diff --staged --quiet" renvoie 0 si rien n'a bouge : dans ce cas
      # on saute le commit, ce qui evite de polluer l'historique avec des
      # commits vides toutes les heures.
      # ----------------------------------------------------------------------
      - name: Publier les donnees modifiees
        id: publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # On ne stage QUE les fichiers produits par ce workflow.
          # data/updates.json est gere par la machine locale : l'inclure ici
          # ferait se marcher dessus les deux automatisations.
          git add data/stats.json data/shop.json

          if git diff --staged --quiet; then
            echo "Aucun changement dans data/ : rien a publier."
            echo "modifie=non" >> "$GITHUB_OUTPUT"
          else
            echo "Fichiers modifies :"
            git diff --staged --name-only

            git commit -m "chore(data): mise a jour automatique des donnees"

            # Le cron et un declenchement manuel peuvent se croiser : on rejoue
            # notre commit par-dessus la branche distante avant de pousser.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "Donnees publiees."
            echo "modifie=oui" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------------
      # DEPLOIEMENT FTP VERS OVH
      #
      # N'envoie QUE le dossier data/ vers /www/data/. Le reste du site
      # (HTML, CSS, JS, images) n'est jamais touche par ce workflow : il est
      # televerse a la main.
      #
      # QUAND : uniquement si les donnees ont reellement change, ou a chaque
      # declenchement manuel (pour pouvoir tester le FTP sans attendre qu'une
      # donnee bouge).
      #
      # SEULS LES FICHIERS MODIFIES SONT ENVOYES : l'action garde un etat
      # (.ftp-deploy-sync-state.json, depose dans /www/data/) qui lui sert a
      # comparer. Ce fichier commence par un point : la regle FilesMatch du
      # .htaccess le rend inaccessible depuis le web.
      #
      # A SAVOIR SUR LES SUPPRESSIONS : cette action synchronise, donc elle
      # supprimerait du serveur un fichier disparu en local. Il n'existe pas
      # d'option pour le desactiver. Le risque est toutefois circonscrit :
      #   - elle n'agit QUE dans /www/data/, jamais ailleurs ;
      #   - les trois JSON sont suivis par Git et les scripts ne les
      #     effacent jamais (en cas d'echec ils laissent l'ancien fichier).
      # Pour une garantie absolue "aucune suppression", il faudrait passer
      # par lftp avec "mirror -R --only-newer" SANS --delete.
      # ----------------------------------------------------------------------
      - name: Deployer data/ sur OVH (FTP)
        id: ftp
        if: steps.publication.outputs.modifie == 'oui' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # FTPS = FTP chiffre (les identifiants ne circulent pas en clair).
          # OVH mutualise l'accepte sur le port 21.
          # >>> Si la connexion echoue avec une erreur TLS, remplace par
          #     protocol: ftp  (non chiffre : a n'utiliser qu'en dernier
          #     recours, et pense alors a changer ton mot de passe FTP
          #     regulierement).
          protocol: ftps
          port: 21

          # "loose" tolere le certificat TLS d'OVH, qui ne correspond pas
          # toujours exactement au nom d'hote. Sans cela, la connexion
          # echouerait sur une erreur de validation de certificat.
          security: loose

          # Les deux chemins DOIVENT se terminer par un slash.
          local-dir: ./data/
          server-dir: /www/data/

          # false = ne vide jamais le dossier distant avant l'envoi.
          dangerous-clean-slate: false

          # Passe a "verbose" si tu dois diagnostiquer un probleme de
          # connexion : le journal detaillera chaque fichier.
          log-level: standard

      # ----------------------------------------------------------------------
      # Recapitulatif lisible dans l'onglet Actions (page du run > Summary).
      # ----------------------------------------------------------------------
      - name: Recapitulatif
        if: always()
        run: |
          {
            echo "## Resultat de la mise a jour"
            echo ""
            echo "| Script | Resultat |"
            echo "|---|---|"
            echo "| Compteur de membres | ${{ steps.membres.outcome }} |"
            echo "| Boutique | ${{ steps.boutique.outcome }} |"
            echo ""
            echo "_Les actualites du jeu sont mises a jour depuis la machine de"
            echo "l'auteur (voir l'etape desactivee dans le workflow)._"
            echo ""
            echo "Donnees modifiees et publiees : ${{ steps.publication.outputs.modifie || 'non determine' }}"
            echo ""
            echo "Deploiement FTP vers OVH : ${{ steps.ftp.outcome || 'non execute (aucune donnee modifiee)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.ftp.outcome }}" = "failure" ]; then
            {
              echo ""
              echo "### Le deploiement FTP a echoue"
              echo ""
              echo "Les donnees sont bien sur GitHub, mais PAS sur le serveur OVH :"
              echo "le site en ligne affiche encore les donnees precedentes."
              echo ""
              echo "A verifier, dans l'ordre :"
              echo "1. les trois secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD"
              echo "   existent bien dans Settings > Secrets and variables > Actions ;"
              echo "2. le mot de passe FTP est toujours valide (espace client OVH) ;"
              echo "3. le dossier /www/data/ existe sur le serveur ;"
              echo "4. si l'erreur mentionne TLS ou un certificat, passe"
              echo "   'protocol: ftps' a 'protocol: ftp' dans le workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.membres.outcome }}" != "success" ] || \
             [ "${{ steps.boutique.outcome }}" != "success" ]; then
            {
              echo ""
              echo "### Au moins un script n'a pas abouti"
              echo ""
              echo "Le fichier JSON concerne n'a PAS ete modifie : le site continue"
              echo "d'afficher la derniere donnee valide."
              echo ""
              echo "Pour comprendre : clique sur l'etape en rouge ci-dessus, le"
              echo "message d'erreur indique quoi corriger (selecteur CSS a ajuster,"
              echo "widget Discord desactive, site source indisponible...)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
